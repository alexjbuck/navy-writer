<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navy Writer</title>
<style>
  :root {
    --bg: #0a0e14;
    --navy: #0f2a4a;
    --accent: #4a90d9;
    --text: #e8edf4;
    --muted: #8a99ab;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background: radial-gradient(ellipse at top, #10213a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 14px 16px 24px;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 2px;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 12px;
    font-size: 0.9rem;
    text-align: center;
  }
  .video-wrap {
    position: relative;
    width: auto;
    height: min(92vh, 1350px);
    max-width: 98vw;
    aspect-ratio: 4 / 5;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
  }
  .play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 10, 20, 0.35);
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .play-overlay:hover { background: rgba(5, 10, 20, 0.5); }
  .play-overlay.hidden { display: none; }
  .play-button {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(74, 144, 217, 0.5);
    transition: transform 0.15s ease;
  }
  .play-overlay:hover .play-button { transform: scale(1.06); }
  .play-button svg { margin-left: 6px; }
  .download-row {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 14px 32px;
    border-radius: 8px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .download-btn:hover {
    background: #5fa0e8;
    transform: translateY(-1px);
  }
  .download-note {
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer {
    margin-top: 20px;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>

  <h1>Navy Writer</h1>
  <p class="subtitle">Watch the overview, then download the tool.</p>

  <div class="video-wrap">
    <video id="demoVideo" src="navy-writer-demo.mp4" playsinline></video>
    <div class="play-overlay" id="playOverlay">
      <div class="play-button">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="download-row">
    <a class="download-btn" href="Navy_Writer_1.0.html" download>
      Download Navy Writer
    </a>
    <span class="download-note">Downloads as an HTML file &mdash; open it directly in your browser.</span>
  </div>

  <footer>Navy Writer 1.0</footer>

  <script>
    const video = document.getElementById('demoVideo');
    const overlay = document.getElementById('playOverlay');

    overlay.addEventListener('click', () => {
      video.controls = true;
      video.play();
      overlay.classList.add('hidden');
    });

    video.addEventListener('pause', () => {
      if (!video.ended) overlay.classList.remove('hidden');
    });
    video.addEventListener('play', () => {
      overlay.classList.add('hidden');
    });
  </script>

</body>
</html>
